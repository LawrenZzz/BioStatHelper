services:
  # PostgreSQL数据库
  postgres:
    image: postgres:15-alpine
    container_name: biostat_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-biostat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-biostat_helper}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - biostat_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-biostat} -d ${POSTGRES_DB:-biostat_helper}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: biostat_backend
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-biostat}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-biostat_helper}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - PERSISTENT_LOGIN=${PERSISTENT_LOGIN:-true}
      - DEBUG=${DEBUG:-false}
      - NAS_HOST=${NAS_HOST:-localhost}
      - NAS_PORT=${NAS_PORT:-8080}
      - NAS_VIDEO_PATH=${NAS_VIDEO_PATH:-./videos}
      - NAS_VIDEO_MOUNT_PATH=/nas/videos
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - MIMO_API_BASE_URL=${MIMO_API_BASE_URL:-}
      - MIMO_API_KEY=${MIMO_API_KEY:-}
      - MIMO_MODEL=${MIMO_MODEL:-mimo-V2.5-pro}
      - MIMO_TIMEOUT_SECONDS=${MIMO_TIMEOUT_SECONDS:-20}
      - MIMO_PROJECT_TIMEOUT_SECONDS=${MIMO_PROJECT_TIMEOUT_SECONDS:-30}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
      # 挂载NAS视频目录（根据实际情况修改）
      - ${NAS_VIDEO_PATH:-./videos}:/nas/videos:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - biostat_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis缓存（可选）
  redis:
    image: redis:7-alpine
    container_name: biostat_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - biostat_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx反向代理（可选）
  nginx:
    image: nginx:alpine
    container_name: biostat_nginx
    ports:
      - "8081:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - biostat_network
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
  redis_data:

networks:
  biostat_network:
    driver: bridge
